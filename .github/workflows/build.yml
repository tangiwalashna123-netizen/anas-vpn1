name: Build ANAS VPN APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ANAS_VPN_Android_Mobile_Build.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          mkdir -p source
          unzip -q ANAS_VPN_Android_Mobile_Build.zip -d source

      - name: Build APK
        run: |
          cd source/ANAS_VPN_Android
          gradle assembleDebug -Pkotlin.jvm.target.validation.mode=warning

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ANAS-VPN-APK
          path: source/ANAS_VPN_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
